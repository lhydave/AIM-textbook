name: Typo Report
description: 报告教材中的错别字、拼写或语法错误
title: "typo: "
labels: ["typo", "triage"]
assignees:
  - octocat
body:
  - type: markdown
    attributes:
      value: |
        感谢您抽出时间报告教材中的错误！请按照以下格式填写，以便我们快速定位和修正问题。
        
        在提交前，请确保您已阅读[Issue规范](../../../issue-format.md)。
  - type: checkboxes
    id: submission-checklist
    attributes:
      label: 提交检查表
      description: 提交之前，请确认您已完成以下事项
      options:
        - label: 我已经阅读并遵守了[Issue规范](../../../issue-format.md)
          required: true
        - label: 我确认这是最新版本 PDF 中的错误
          required: true
        - label: 我已经搜索过之前的 Issue，确保这个问题没有被其他人报告过
          required: true
  - type: textarea
    id: location
    attributes:
      label: 错误位置
      description: 请详细描述错误在PDF中的具体位置
      placeholder: |
        PDF页码：例如 5
        节号/节名：例如 第1.1节
        段落位置：例如 第2段
        LaTeX源文件(如果知道)：例如 plausible-reasoning.tex, 第42行
    validations:
      required: true
  - type: textarea
    id: original-content
    attributes:
      label: 原始内容
      description: 请引用包含错误的原始文本
      placeholder: 例如：韩素 $f$ 在点 $x = a$ 处是连续的...
    validations:
      required: true
  - type: textarea
    id: problem-description
    attributes:
      label: 问题描述
      description: 请清晰描述问题并给出修改建议
      placeholder: 例如："韩素"应改为"函数"。
      value: ""
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截图（如有必要）
      description: 对于排版问题，请提供截图以便更清楚地展示问题
      placeholder: 拖拽图片到此处上传
    validations:
      required: false